{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bloom & Blossom</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(135deg,
                    #fff5f7,
                    #ffe9ed);

            color: #292125;

            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .auth-navbar {

            width: 100%;

            height: 78px;

            padding: 0 8%;

            background: #ffffff;

            border-bottom: 1px solid #eeeeee;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .auth-logo {

            color: #292125;

            font-size: 25px;

            font-weight: 700;

            text-decoration: none;
        }


        .auth-back {

            color: #d85c75;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;
        }


        .auth-back:hover {

            text-decoration: underline;
        }


        /* =========================
           LOGIN AREA
        ========================= */

        .login-page {

            min-height: calc(100vh - 78px);

            padding: 60px 20px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .login-card {

            width: 100%;

            max-width: 450px;

            padding: 42px;

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 20px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.08);
        }


        .login-heading {

            margin-bottom: 30px;

            text-align: center;
        }


        .login-heading p {

            margin: 0 0 10px;

            color: #d85c75;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 3px;
        }


        .login-heading h1 {

            margin: 0 0 10px;

            font-size: 34px;

            color: #292125;
        }


        .login-heading span {

            color: #888888;

            font-size: 14px;
        }


        /* =========================
           MESSAGES
        ========================= */

        .auth-message {

            margin-bottom: 20px;

            padding: 12px 15px;

            border-radius: 8px;

            background: #fff0f0;

            border: 1px solid #f0cccc;

            color: #b94a48;

            font-size: 13px;

            text-align: center;
        }


        /* =========================
           FORM
        ========================= */

        .login-field {

            margin-bottom: 20px;
        }


        .login-field label {

            display: block;

            margin-bottom: 8px;

            color: #333333;

            font-size: 14px;

            font-weight: 600;
        }


        .login-field input {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #dddddd;

            border-radius: 9px;

            outline: none;

            background: #ffffff;

            color: #333333;

            font-size: 14px;
        }


        .login-field input:focus {

            border-color: #d85c75;

            box-shadow:
                0 0 0 3px rgba(216, 92, 117, 0.10);
        }


        /* =========================
           BUTTON
        ========================= */

        .login-button {

            width: 100%;

            margin-top: 5px;

            padding: 14px 20px;

            border: none;

            border-radius: 30px;

            background: #d85c75;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-button:hover {

            background: #b94760;

            transform: translateY(-2px);
        }


        /* =========================
           REGISTER LINK
        ========================= */

        .register-link {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;

            color: #777777;

            font-size: 14px;

            text-align: center;
        }


        .register-link a {

            color: #d85c75;

            font-weight: bold;

            text-decoration: none;
        }


        .register-link a:hover {

            text-decoration: underline;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .auth-navbar {

                padding: 0 5%;
            }


            .auth-logo {

                font-size: 21px;
            }


            .login-page {

                padding: 40px 15px;
            }


            .login-card {

                padding: 30px 25px;
            }


            .login-heading h1 {

                font-size: 29px;
            }

        }
    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="auth-navbar">


        <a href="/" class="auth-logo">

            🌸 Bloom & Blossom

        </a>


        <a href="/shop/" class="auth-back">

            ← Back to Shop

        </a>


    </header>



    <!-- =========================
         LOGIN
    ========================= -->

    <main class="login-page">


        <div class="login-card">


            <div class="login-heading">

                <p>
                    WELCOME BACK
                </p>


                <h1>
                    Login
                </h1>


                <span>
                    Login to manage your orders
                    and account.
                </span>

            </div>



            <!-- =====================
                 MESSAGES
            ====================== -->

            {% if messages %}

            {% for message in messages %}

            <div class="auth-message">

                {{ message }}

            </div>

            {% endfor %}

            {% endif %}



            <!-- =====================
                 LOGIN FORM
            ====================== -->

            <form method="POST">

                {% csrf_token %}


                <div class="login-field">

                    <label for="username">

                        Username

                    </label>


                    <input type="text" id="username" name="username" placeholder="Enter your username" required>

                </div>



                <div class="login-field">

                    <label for="password">

                        Password

                    </label>


                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                </div>



                <button type="submit" class="login-button">

                    Login

                </button>


            </form>



            <!-- =====================
                 REGISTER LINK
            ====================== -->

            <div class="register-link">

                Don't have an account?

                <a href="{% url 'register' %}">

                    Create Account

                </a>

            </div>


        </div>


    </main>


</body>

</html>
